apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app4
  template:
    metadata:
      labels:
        app: app4
    spec:
      containers:
        - name: app4
          image: app4:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app4-service
spec:
  type: NodePort
  selector:
    app: app4
  ports:
    - port: 80
      targetPort: 80
