
$appNames = @("app2", "app3", "app4")

foreach ($app in $appNames) {
@"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: $app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: $app
  template:
    metadata:
      labels:
        app: $app
    spec:
      containers:
        - name: $app
          image: ${app}:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ${app}-service
spec:
  type: NodePort
  selector:
    app: $app
  ports:
    - port: 80
      targetPort: 80
"@ | Set-Content -Encoding utf8 "k8s/$app.yaml"
}
